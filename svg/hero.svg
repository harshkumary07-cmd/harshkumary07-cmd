<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Heading Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="1200"
    height="520"
    rx="24"
    fill="url(#bg)"
  />


  <!-- ========================= -->
  <!-- GRID -->
  <!-- ========================= -->

  <g opacity="0.08" stroke="#ffffff">

    <path d="M0 80H1200"/>
    <path d="M0 160H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 320H1200"/>
    <path d="M0 400H1200"/>

    <path d="M120 0V520"/>
    <path d="M240 0V520"/>
    <path d="M360 0V520"/>
    <path d="M480 0V520"/>
    <path d="M600 0V520"/>
    <path d="M720 0V520"/>
    <path d="M840 0V520"/>
    <path d="M960 0V520"/>
    <path d="M1080 0V520"/>

  </g>


  <!-- ========================= -->
  <!-- TOP LABEL -->
  <!-- ========================= -->

  <text
    x="70"
    y="72"
    fill="#7dd3fc"
    font-family="monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="3">
    HARSH KUMAR
  </text>


  <!-- ========================= -->
  <!-- MAIN HEADING -->
  <!-- ========================= -->

  <text
    x="70"
    y="145"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="800">
    AI/ML ENGINEER
  </text>

  <text
    x="70"
    y="200"
    fill="url(#accent)"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="800">
    ASPIRANT
  </text>


  <!-- ========================= -->
  <!-- DESCRIPTION -->
  <!-- ========================= -->

  <text
    x="70"
    y="250"
    fill="#cbd5e1"
    font-family="Arial, sans-serif"
    font-size="19">
    Building intelligent systems, AI-powered products,
  </text>

  <text
    x="70"
    y="280"
    fill="#cbd5e1"
    font-family="Arial, sans-serif"
    font-size="19">
    and scalable software that solve real problems.
  </text>


  <!-- ========================= -->
  <!-- STACK -->
  <!-- ========================= -->

  <text
    x="70"
    y="330"
    fill="#94a3b8"
    font-family="monospace"
    font-size="16">
    Python • ML • DL • LLMs • RAG • Agents • FastAPI
  </text>


  <!-- ========================= -->
  <!-- TERMINAL -->
  <!-- ========================= -->

  <g>

    <!-- Terminal body -->
    <rect
      x="650"
      y="70"
      width="480"
      height="250"
      rx="16"
      fill="#05070c"
      stroke="#263244"
      stroke-width="2"
    />


    <!-- Terminal top buttons -->

    <circle
      cx="680"
      cy="100"
      r="6"
      fill="#ff5f56"
    />

    <circle
      cx="702"
      cy="100"
      r="6"
      fill="#ffbd2e"
    />

    <circle
      cx="724"
      cy="100"
      r="6"
      fill="#27c93f"
    />


    <!-- ========================= -->
    <!-- TERMINAL CONTENT -->
    <!-- ========================= -->

    <g
      font-family="monospace"
      font-size="16"
      fill="#E2E8F0">

      <!-- Command -->
      <text
        x="675"
        y="140"
        fill="#22D3EE">
        $ ./harsh
      </text>


      <!-- Input -->
      <text
        x="675"
        y="175">

        <tspan fill="#A78BFA">input</tspan>
        <tspan>   → problem</tspan>

      </text>


      <!-- Process -->
      <text
        x="675"
        y="210">

        <tspan fill="#A78BFA">process</tspan>
        <tspan> → understand → build → test</tspan>

      </text>


      <!-- Intent -->
      <text
        x="675"
        y="245">

        <tspan fill="#A78BFA">intent</tspan>
        <tspan>  → useful over flashy</tspan>

      </text>


      <!-- Default -->
      <text
        x="675"
        y="280">

        <tspan fill="#A78BFA">default</tspan>
        <tspan> → keep learning</tspan>

      </text>


      <!-- Status -->
      <text
        x="675"
        y="305"
        fill="#22D3EE">
        $ status
      </text>


      <!-- BUILDING -->
      <text
        x="785"
        y="305"
        fill="#22D3EE">
        BUILDING
      </text>

    </g>


    <!-- ========================= -->
    <!-- SUBTLE BLINKING CURSOR -->
    <!-- ========================= -->

    <rect
      x="868"
      y="292"
      width="3"
      height="18"
      fill="#22D3EE">

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1.1s"
        repeatCount="indefinite"
      />

    </rect>

  </g>


  <!-- ========================= -->
  <!-- CHARACTER -->
  <!-- ========================= -->

  <image
    href="../assets/character-hero.png"
    x="820"
    y="315"
    width="340"
    height="205"
    preserveAspectRatio="xMidYMax meet"
  />


  <!-- ========================= -->
  <!-- FOOTER MARKER -->
  <!-- ========================= -->

  <text
    x="70"
    y="445"
    fill="#64748b"
    font-family="monospace"
    font-size="14">
    01 // BUILD • LEARN • SHIP
  </text>


</svg>